name: lua

on:
  push:
    paths:
      - 'lua/**'
      - 'TOPICS.md'
      - '.github/workflows/lua.yml'
  pull_request:
    paths:
      - 'lua/**'
      - 'TOPICS.md'
      - '.github/workflows/lua.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Run every example
        run: |
          mapfile -t examples < <(find lua -name '*.lua' | sort)
          test "${#examples[@]}" -gt 0
          for f in "${examples[@]}"; do
            echo "== $f =="
            lua5.4 "$f"
          done
