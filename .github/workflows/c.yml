name: c

on:
  push:
    paths:
      - 'c/**'
      - '.github/workflows/c.yml'
  pull_request:
    paths:
      - 'c/**'
      - '.github/workflows/c.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S c -B c/build

      - name: Build
        run: cmake --build c/build

      - name: Run every example
        run: |
          for b in c/build/bin/*; do
            echo "== $b =="
            "$b"
          done
