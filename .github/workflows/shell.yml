name: shell

on:
  push:
    paths:
      - 'scripts/shell/**'
      - 'TOPICS.md'
      - '.github/workflows/shell.yml'
  pull_request:
    paths:
      - 'scripts/shell/**'
      - 'TOPICS.md'
      - '.github/workflows/shell.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run standalone examples and syntax-check helpers
        run: |
          count=0
          while IFS= read -r f; do
            echo "== $f =="
            bash "$f"
            count=$((count + 1))
          done < <(grep -rl '^# 主题说明：' scripts/shell --include='*.sh' | sort)
          test "$count" -gt 0
          find scripts/shell -name '*.sh' -print0 | xargs -0 -n1 bash -n
