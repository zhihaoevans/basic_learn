name: javascript

on:
  push:
    paths:
      - 'javascript/**'
      - 'languages/javascript/**'
      - 'web/frontend/**'
      - 'TOPICS.md'
      - '.github/workflows/javascript.yml'
  pull_request:
    paths:
      - 'javascript/**'
      - 'languages/javascript/**'
      - 'web/frontend/**'
      - 'TOPICS.md'
      - '.github/workflows/javascript.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run languages/javascript tests
        run: node --test languages/javascript/tests

      - name: Run javascript basics examples
        run: |
          shopt -s nullglob
          examples=(javascript/*.js)
          test "${#examples[@]}" -gt 0
          for f in javascript/*.js; do
            echo "== $f =="
            node "$f"
          done

      - name: Build web/frontend/vue3
        run: |
          cd web/frontend/vue3
          npm ci --no-audit --no-fund
          npm run build
