name: sql

on:
  push:
    paths:
      - 'sql/**'
      - 'TOPICS.md'
      - '.github/workflows/sql.yml'
  pull_request:
    paths:
      - 'sql/**'
      - 'TOPICS.md'
      - '.github/workflows/sql.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # sql/ 目录已随 Phase 2 落地（seed.sql 建样例库 + 每主题一个 .sql）；compgen 兜底空转分支保留
      - name: Run every example
        run: |
          test -f sql/seed.sql
          mapfile -t examples < <(find sql -maxdepth 1 -name '[0-9]*.sql' | sort)
          test "${#examples[@]}" -gt 0
          database="$RUNNER_TEMP/basic-learn-sql.sqlite"
          sqlite3 "$database" < sql/seed.sql
          for f in "${examples[@]}"; do
            echo "== $f =="
            sqlite3 "$database" < "$f"
          done
