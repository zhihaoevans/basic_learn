name: sql

on:
  push:
    paths:
      - 'sql/**'
      - '.github/workflows/sql.yml'
  pull_request:
    paths:
      - 'sql/**'
      - '.github/workflows/sql.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # sql/ 目录已随 Phase 2 落地（seed.sql 建样例库 + 每主题一个 .sql）；compgen 兜底空转分支保留
      - name: Run every example
        run: |
          if compgen -G "sql/*.sql" > /dev/null; then
            rm -f sql/db.sqlite
            if [ -f sql/seed.sql ]; then
              sqlite3 sql/db.sqlite < sql/seed.sql
            fi
            for f in sql/[0-9]*.sql; do
              echo "== $f =="
              sqlite3 sql/db.sqlite < "$f"
            done
          else
            echo "暂无 SQL 示例（示例文件被删除时），空转通过"
          fi
