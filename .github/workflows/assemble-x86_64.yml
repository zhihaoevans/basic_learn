name: assemble-x86_64

on:
  push:
    paths:
      - 'assembly/**'
      - 'TOPICS.md'
      - '.github/workflows/assemble-x86_64.yml'
  pull_request:
    paths:
      - 'assembly/**'
      - 'TOPICS.md'
      - '.github/workflows/assemble-x86_64.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GNU binutils
        run: sudo apt-get update && sudo apt-get install -y binutils

      - name: Build x86_64 examples
        run: make -C assembly/x86_64

      - name: Smoke run
        run: |
          ./assembly/x86_64/01_basics/hello_write
          set +e
          ./assembly/x86_64/01_basics/exit_code
          status=$?
          set -e
          test "$status" -eq 42
