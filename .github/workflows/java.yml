name: java

on:
  push:
    paths:
      - 'java/**'
      - '.github/workflows/java.yml'
  pull_request:
    paths:
      - 'java/**'
      - '.github/workflows/java.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 12_module 依赖 JDK 22 起单文件模式的同目录隐式编译（21 及以下报 cannot find symbol），取 LTS 25
          java-version: '25'

      # JDK 11+ 单文件源码直运行，无需 javac/构建工具
      - name: Run every example
        run: |
          find java -name '*.java' | sort | while read -r f; do
            echo "== $f =="
            java "$f"
          done
