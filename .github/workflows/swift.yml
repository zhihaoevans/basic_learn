name: swift

on:
  push:
    paths:
      - 'swift/**'
      - 'TOPICS.md'
      - '.github/workflows/swift.yml'
  pull_request:
    paths:
      - 'swift/**'
      - 'TOPICS.md'
      - '.github/workflows/swift.yml'
  workflow_dispatch:

jobs:
  verify:
    # AppKit/SwiftUI 仅 Apple 平台可用，须用 macOS 运行器
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Swift package
        run: |
          test -f swift/Package.swift
          swift build --package-path swift
