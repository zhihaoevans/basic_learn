name: typescript

on:
  push:
    paths:
      - 'typescript/**'
      - 'TOPICS.md'
      - '.github/workflows/typescript.yml'
  pull_request:
    paths:
      - 'typescript/**'
      - 'TOPICS.md'
      - '.github/workflows/typescript.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # typescript/ 目录已随 Phase 2 落地（src/ 每主题一个 .ts）；compgen 兜底空转分支保留
      - name: Run every example
        run: |
          test -f typescript/package-lock.json
          shopt -s nullglob
          examples=(typescript/src/*.ts)
          test "${#examples[@]}" -gt 0
          cd typescript
          npm ci --no-audit --no-fund
          npx --package typescript tsc --noEmit
          for f in src/*.ts; do
            echo "== $f =="
            npx tsx "$f"
          done
